# Publish @crewbeat/react-native-chessboard to npm on a version tag.
#
# Triggers:
#   - push: tags 'v*' (release: build + publish to npm)
#
# Auth: publish uses npm OIDC Trusted Publishing — NO long-lived
# NPM_TOKEN. GitHub mints a short-lived signed identity token (the
# `id-token: write` permission); npm verifies GitHub's signature and
# matches it against the trusted-publisher config registered for
# react-native-chessboard (repo + this workflow file). Provenance is
# generated automatically from the same identity.
#
# One-time npmjs.com setup (until done, publish 403s):
#   @crewbeat/react-native-chessboard -> Settings -> Trusted Publisher ->
#   add a GitHub Actions publisher:
#     repository:  Xelaan/react-native-chessboard
#     workflow:    release.yml
#     environment: release
#
# NOTE for the very first release of this scoped name: npm can only
# attach a trusted publisher to a package that already exists, so
# 0.3.0-beta.1 may have to be published once from a workstation
# (`npm publish --access public --tag beta` with 2FA). Every release
# after that goes through this workflow with no token.
#
# One-time GitHub setup: Settings -> Environments -> create `release`
# and add yourself as a required reviewer. A pushed tag then waits for
# manual approval before it can publish — a tag alone never ships
# unattended.
#
# Cut a release:
#   1. bump "version" in package.json (e.g. 0.2.0-beta.2 or 0.2.0)
#   2. git tag v0.2.0-beta.2 && git push origin v0.2.0-beta.2
#   3. approve the `release` environment in the Actions run
# Prerelease versions (contain a hyphen) publish to the `beta`
# dist-tag; plain versions publish to `latest`.
#
# Every third-party action is pinned to a full commit SHA so a hijacked
# tag can't inject code into the job that holds the OIDC grant. The
# trailing comment is the tag that SHA came from — re-resolve it when
# bumping, don't trust the comment alone.
name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm (OIDC trusted publishing)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # `release` is a protected GitHub Environment: it requires a manual
    # approval (reviewer) before this job runs, so a pushed tag alone
    # never publishes unattended. Reviewers are configured in repo
    # Settings -> Environments -> release.
    environment: release
    # `id-token: write` lets the runner request the OIDC identity token
    # npm verifies. `contents: read` is all the checkout needs. No token
    # secret is referenced anywhere in this job.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.19
      # NO `registry-url` here, deliberately. That option makes setup-node
      # write an .npmrc containing
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and point npm at it. With no NODE_AUTH_TOKEN set — which is the whole
      # point of trusted publishing — that resolves to an EMPTY token, npm
      # decides it already has a credential, and never performs the OIDC
      # handshake. The registry then rejects the empty credential and npm
      # reports it as a 404 (it masks 403s so it can't leak whether a package
      # exists), which looks exactly like a misconfigured trusted publisher
      # and sends you looking in the wrong place. npmjs.org is the default
      # registry anyway, so nothing is lost by omitting it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1. Pinned
          # rather than floating on `22` so a runner image change can't quietly
          # drop below the floor.
          node-version: 22.14.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build the publishable output (lib/) with react-native-builder-bob.
      # Calling bob directly skips the husky install in the `prepare`
      # script, which is pointless in CI.
      - name: Build
        # Production Babel env: keeps dev-only JSX transforms (and the
        # absolute source paths they embed) out of the published files.
        env:
          BABEL_ENV: production
          NODE_ENV: production
        run: bunx bob build

      # Prints whether the OIDC token endpoint is actually available to this
      # job. Without `id-token: write` these are unset, npm silently falls
      # back to token auth, and the failure looks like a registry problem
      # rather than a permissions one. Values are never printed — only whether
      # they exist.
      - name: Check the OIDC environment
        run: |
          echo "node: $(node --version)"
          echo "id-token request URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "id-token request token present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-NO}"

      - name: npm publish (OIDC + provenance)
        run: |
          # OIDC Trusted Publishing requires npm >= 11.5.0. The Node 22
          # toolchain ships an older npm, so upgrade in-job. No
          # NODE_AUTH_TOKEN and no .npmrc auth line: `npm publish` performs
          # the OIDC handshake itself when a trusted publisher is configured
          # for this package, and emits provenance from the same identity.
          #
          # Note that provenance signing succeeding proves nothing about npm
          # authorization — that goes GitHub OIDC -> Sigstore directly, with
          # npm nowhere in the exchange. Don't read it as a green light.
          npm install -g npm@latest
          npm --version
          # Route prerelease versions (0.2.0-beta.1, -rc.1, …) to the
          # `beta` dist-tag so they never clobber `latest`. Plain
          # versions go to `latest`. npm does NOT auto-route prereleases.
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) DIST_TAG=beta ;;
            *)   DIST_TAG=latest ;;
          esac
          echo "Publishing $VERSION to dist-tag: $DIST_TAG"
          npm publish --provenance --access public --tag "$DIST_TAG"
